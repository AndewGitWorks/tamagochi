services:
  tamagochi-postgres:
    image: postgres:18.1-bookworm
    container_name: tamagochi-env-postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  tamagochi-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat
    command:
      - TCP4-LISTEN:5432,fork,reuseaddr
      - TCP4:tamagochi-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      - tamagochi-postgres
    restart: always
