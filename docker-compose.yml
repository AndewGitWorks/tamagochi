services:
  tamagochi-postgres:
    image: postgres:18.1-bookworm
    container_name: tamagochi-env-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  tamagochi-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations:ro
    depends_on:
      tamagochi-postgres:
        condition: service_healthy

  port-forwarder:
    image: alpine/socat
    command:
      - TCP4-LISTEN:5432,fork,reuseaddr
      - TCP4:tamagochi-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      tamagochi-postgres:
        condition: service_healthy
    restart: unless-stopped
